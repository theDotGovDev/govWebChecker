name: pages

# Publishes the site from the stored record.
#
# Runs after a check has committed new observations, so the site follows the data
# rather than being rebuilt on a schedule of its own and going stale between.

on:
  push:
    branches: [main]
    paths:
      - 'data/**'
      - 'src/site/**'
      - 'src/cli/build-site.ts'
      - 'targets/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; a queued run supersedes an older one, since only the
# newest build reflects the current record.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npm run build

      - name: Generate the site
        run: node dist/src/cli/build-site.js targets/federal.json data docs

      - uses: actions/configure-pages@v5
        with:
          # Turns Pages on via the API the first time this runs, so publishing
          # is not a setting someone had to remember to click. The repository's
          # own settings still belong in Terraform (task T049); this is the
          # narrow exception that lets the site exist before that lands.
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
