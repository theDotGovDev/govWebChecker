name: probe-data-sources

# Reports whether the upstream data sources this project depends on are still
# published, and in what shape.
#
# It exists because those sources cannot be reached from a development sandbox
# (see AGENTS.md), so "does this endpoint exist" is a question only a runner can
# answer. Keeping it as a workflow means the answer is reproducible rather than
# something one person checked once and wrote down.
#
# This reads published data files. It sends no traffic to any measurement target
# and is unrelated to the checker.

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe candidate sources
        run: |
          set -uo pipefail

          probe() {
            local label="$1" url="$2"
            local code size first
            code=$(curl -sS -o /tmp/body -w '%{http_code}' -L --max-time 30 "$url" 2>/dev/null || echo "000")
            size=$(wc -c < /tmp/body 2>/dev/null || echo 0)
            first=$(head -c 180 /tmp/body 2>/dev/null | tr '\n' ' ' | tr -d '\r')
            printf '%-46s %-4s %10s bytes\n' "$label" "$code" "$size"
            if [ "$code" = "200" ] && [ "$size" -gt 0 ]; then
              printf '    head: %s\n' "$first"
              printf '    lines: %s\n' "$(wc -l < /tmp/body)"
            fi
            printf '\n'
          }

          echo "=== Federal traffic (Digital Analytics Program) ==="
          probe "analytics.usa.gov top-domains-30-days.csv" \
            "https://analytics.usa.gov/data/live/top-domains-30-days.csv"
          probe "analytics.usa.gov top-domains-7-days.csv" \
            "https://analytics.usa.gov/data/live/top-domains-7-days.csv"
          probe "analytics.usa.gov sites.csv" \
            "https://analytics.usa.gov/data/live/sites.csv"
          probe "analytics.usa.gov top-pages-30-days.csv" \
            "https://analytics.usa.gov/data/live/top-pages-30-days.csv"
          probe "analytics.usa.gov (root, sanity check)" \
            "https://analytics.usa.gov/"

          echo "=== .gov registry (CISA) ==="
          probe "cisagov current-federal.csv" \
            "https://raw.githubusercontent.com/cisagov/dotgov-data/main/current-federal.csv"
          probe "cisagov current-full.csv" \
            "https://raw.githubusercontent.com/cisagov/dotgov-data/main/current-full.csv"

          echo "=== Candidate sources of .gov HOSTNAMES (not just registered domains) ==="
          echo "The registry publishes registered domains and no list of the hosts"
          echo "beneath them. A census keyed on domains therefore cannot see"
          echo "pubmed.ncbi.nlm.nih.gov or forecast.weather.gov, which are distinct"
          echo "websites. These are the candidates for closing that gap; whichever"
          echo "answer 200 with a plausible shape decide what a host-level frame can"
          echo "be built from."
          echo

          probe "GSA federal-website-index (site scanning list)" \
            "https://raw.githubusercontent.com/GSA/federal-website-index/main/data/site-scanning-target-url-list.csv"
          probe "GSA federal-website-index (repo root listing)" \
            "https://api.github.com/repos/GSA/federal-website-index/contents/data"
          probe "GSA data dotgov-websites (repo listing)" \
            "https://api.github.com/repos/GSA/data/contents/dotgov-websites"
          probe "GSA site-scanning-snapshots (repo listing)" \
            "https://api.github.com/repos/GSA/site-scanning-snapshots/contents/"
          probe "CISA/GSA site scanning API (websites)" \
            "https://api.gsa.gov/technology/site-scanning/v1/websites?limit=1"
          probe "analytics.usa.gov sites.csv (hostnames DAP tracks)" \
            "https://analytics.usa.gov/data/live/sites.csv"
          probe "crt.sh certificate transparency (nih.gov sample)" \
            "https://crt.sh/?q=%25.nih.gov&output=json&exclude=expired"

          echo "Probe complete. A 200 with a plausible head means the source is usable;"
          echo "anything else means the target list needs a different basis."

      - name: Characterise the federal website index
        # A source existing is not the same as a source being usable. This asks the
        # questions that decide whether a host-level frame is feasible at all: how
        # many hosts, over how many registered domains, and — the one that matters
        # — whether it covers anything beyond federal. The census is 92% local
        # government, so a federal-only index closes the subdomain gap for the
        # small part of the frame and none of the large part.
        run: |
          set -uo pipefail
          url="https://raw.githubusercontent.com/GSA/federal-website-index/main/data/site-scanning-target-url-list.csv"
          curl -sS -L --max-time 60 "$url" -o /tmp/index.csv || { echo "fetch failed"; exit 0; }

          python3 - <<'PY'
          import csv, collections
          rows = list(csv.DictReader(open('/tmp/index.csv', newline='')))
          print(f"rows: {len(rows)}")
          print(f"columns: {', '.join(rows[0].keys())}")

          hosts = {r['initial_url'] for r in rows if r.get('initial_url')}
          bases = {r['base_domain'] for r in rows if r.get('base_domain')}
          print(f"distinct initial_url: {len(hosts)}")
          print(f"distinct base_domain: {len(bases)}")
          if bases:
              print(f"hosts per registered domain: {len(hosts)/len(bases):.1f}")

          for col in ('top_level_domain', 'branch'):
              if col in rows[0]:
                  c = collections.Counter(r[col] for r in rows)
                  print(f"\n{col}: " + ", ".join(f"{k or '(blank)'}={v}" for k, v in c.most_common(8)))

          print("\nper-domain host counts, largest:")
          c = collections.Counter(r['base_domain'] for r in rows)
          for d, n in c.most_common(8):
              print(f"  {d}: {n}")

          print("\nsource lists each host came from:")
          for col in rows[0]:
              if col.startswith('source_list_'):
                  n = sum(1 for r in rows if r[col] and r[col].lower() not in ('false', '0', ''))
                  print(f"  {col}: {n}")
          PY
