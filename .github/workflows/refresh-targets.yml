name: refresh-targets

# Rebuilds the target list from published traffic and registry data, and opens a
# pull request with the result.
#
# It opens a PR rather than committing: FR-001 makes adding a target a deliberate
# act, and a list that changes itself on a schedule is not deliberate. The
# generation is automatic; adopting the change is not.

on:
  workflow_dispatch:
    inputs:
      limit:
        description: 'How many of the highest-traffic hosts to consider'
        required: false
        default: '100'

permissions:
  contents: write
  pull-requests: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - run: npm ci
      - run: npm run build

      - name: Fetch published sources
        run: |
          set -euo pipefail
          mkdir -p .sources
          curl -sSfL --max-time 60 \
            "https://analytics.usa.gov/data/live/sites.csv" -o .sources/traffic.csv
          curl -sSfL --max-time 60 \
            "https://raw.githubusercontent.com/cisagov/dotgov-data/main/current-federal.csv" \
            -o .sources/registry.csv
          wc -l .sources/traffic.csv .sources/registry.csv

      - name: Rebuild the target list
        run: |
          node dist/src/cli/build-targets.js \
            .sources/traffic.csv \
            .sources/registry.csv \
            targets/agency-overrides.json \
            targets/federal.json \
            "${{ inputs.limit }}" | tee .sources/report.txt

      - name: Confirm the result is loadable before proposing it
        # The list is validated by the same loader the checker uses, so a
        # generated file that would break a run is caught here rather than at
        # 07:17 UTC tomorrow.
        run: |
          node --input-type=module -e "
          import {parseTargets, activeTargets} from './dist/src/targets/load.js';
          import fs from 'node:fs';
          const t = parseTargets(fs.readFileSync('targets/federal.json','utf8'));
          console.log('loads cleanly:', t.length, 'targets,', activeTargets(t).length, 'active');
          "

      - name: Open a pull request with the change
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          rm -rf .sources
          if [ -z "$(git status --porcelain targets/)" ]; then
            echo "target list unchanged — nothing to propose"
            exit 0
          fi

          branch="refresh-targets/$(date -u +%Y%m%d-%H%M%S)"
          git config user.name 'govwebchecker[bot]'
          git config user.email 'govwebchecker[bot]@users.noreply.github.com'
          git checkout -b "$branch"
          git add targets/
          git commit -m "data: refresh the target list from published traffic"
          git push -u origin "$branch"

          gh pr create \
            --title "data: refresh the target list from published traffic" \
            --body "Regenerated by the refresh-targets workflow from analytics.usa.gov and the CISA .gov registry.

          Review the diff before merging: each entry cites the visits that earned its place, and any host considered but excluded is listed in the run log with the reason.

          ---
          _Generated by [Claude Code](https://claude.ai/code)_"
