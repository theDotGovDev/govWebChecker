name: census

# The broad tier: every registered US `.gov` domain, covered over about a week.
#
# One seventh of the frame per day. The slice is a pure function of the date, so
# seven consecutive runs cover the frame exactly once — no domain twice, none
# missed — and a domain's slice never moves when the registry gains or loses
# entries (spec.md FR-111 to FR-113).
#
# This is NOT an outage-detection instrument, and the record says so. A weekly
# reading cannot see a thirty-minute interruption; that is what the hourly hot
# tier in `check.yml` is for. This answers questions about coverage and change
# over months.
#
# Cost per run: at most one reading plus one robots.txt per domain that publishes
# a web address — roughly 2,045 of the ~2,364 in a slice. The rest publish no web
# address and receive no request at all, because DNS already told us there is
# nothing there and asking anyway would spend a jurisdiction's resources to learn
# it twice.

# Runs daily at 09:07 UTC — deliberately away from check.yml's hourly slot
# (research.md R5).
#
# The schedule was disabled through three runs and is back on the evidence of the
# fourth. Run 32554093317 was cancelled at the 120-minute cap. Run 32579108046
# finished in 99m42s and was rejected by a coverage check comparing one day of a
# seven-day cycle against the whole frame. Run 32605088681 finished in 40m38s with
# every guarantee holding, and failed only to push, because two appends to one
# append-only file are not a conflict git can resolve.
#
# All three causes are fixed: coverage is slice-aware, R8a charges robots.txt and
# the page it governs as one visit, and publication no longer rebases. What made
# the schedule safe to restore is the last one plus the artifact upload — a run
# that fails now costs the commit, not the readings, which is not a claim: run
# 32605088681's 2,310 observations were recovered from its artifact and published.

on:
  schedule:
    - cron: '7 9 * * *'
  workflow_dispatch:
    inputs:
      slice:
        description: 'Slice to run (0-6). Blank uses the slice for today.'
        required: false
        default: ''

# One group across every workflow that sends traffic to a target — `check`,
# `census` and `deep-check`. The politeness limits live in a RateLimiter
# *instance*, so they hold within one process and are blind to a second collector
# on another runner. Serializing the collectors is what makes the per-address
# guarantee true of the published record rather than merely true of each run.
#
# This reverses a deliberate choice (research.md R5): the groups were split so a
# long census could not block the hourly check, accepting cross-tier overlap as a
# bounded risk "visible afterwards through verify". It materialised on
# 2026-08-26 — a census slice and an hourly check hit one WordPress VIP edge
# 126ms apart — and the cost was the opposite of what the split protected. The
# record is append-only, so that pair failed verify on every subsequent run and
# twenty hours of hourly readings were collected and discarded, against the one
# or two slots per day that queueing costs.
#
# Queue rather than cancel: a cancelled run is a gap in the record, and gaps are
# meant to mean "we did not measure". GitHub still keeps only one run pending per
# group, so an hourly check that collides with a long collector runs late, and a
# second one behind it is dropped. That is a visible gap rather than a false
# claim, which is the direction Principle V requires erring in.
concurrency:
  group: target-traffic
  cancel-in-progress: false

# Every collector commits to the same file; the rebase-retry below is what makes
# concurrent *publication* safe. This group is about concurrent *traffic*.

permissions:
  contents: write

jobs:
  census:
    runs-on: ubuntu-latest
    # Measured, not assumed. The first sweep hit this cap exactly; the second
    # finished in 99m42s. Raising it was never the answer — the per-host interval
    # being charged twice per domain was the cost, and R8a removes that rather
    # than giving the same waste more room.
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - run: npm ci
      - run: npm run build

      - name: Run one slice of the census
        # The slice is read from the environment rather than interpolated into the
        # command. On a scheduled run `inputs` does not exist, and an expression
        # that assumes it does would pass a bare `--slice` with no value.
        env:
          SLICE: ${{ github.event.inputs.slice }}
        run: |
          set -e
          if [ -n "$SLICE" ]; then
            node dist/src/cli/index.js census --slice "$SLICE"
          else
            node dist/src/cli/index.js census
          fi

      - name: Keep the readings before anything can reject them
        # A slice costs about a hundred minutes of real requests to roughly two
        # thousand government servers. Twice now that traffic has been spent and
        # discarded — once to the job cap, once to a `verify` check that was wrong
        # about what it was measuring. Both times the readings existed on disk and
        # died with the runner.
        #
        # Uploading first means a rejection costs the commit, not the measurements.
        # Whatever the gate below decides, the data can be inspected, and published
        # after review rather than re-collected at the targets' expense.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: census-record-${{ github.run_id }}
          path: data/
          retention-days: 14
          if-no-files-found: warn

      - name: Verify our own conduct before publishing it
        # Identical in spirit to `check.yml`: a run that violated a politeness
        # guarantee discards its readings rather than publishing them. Publishing
        # data that fails our own stated checks would be worse than publishing
        # nothing.
        #
        # Only observation files are verified. `data/runs/` holds run summaries,
        # which have no host and are not what `verify` checks.
        run: |
          set -e
          shopt -s nullglob
          files=(data/availability/*.jsonl)
          if [ ${#files[@]} -eq 0 ]; then
            echo "no observation files produced — nothing to verify or publish"
            exit 0
          fi
          for file in "${files[@]}"; do
            echo "verifying $file"
            node dist/src/cli/index.js verify "$file"
          done

      - name: Publish the record
        # Append-only rows, published past whatever else landed while this slice
        # was running — which for a forty-minute census is an hourly check, every
        # time. The script holds the logic and is tested; see
        # tests/integration/publish-record.test.ts.
        run: |
          scripts/publish-record.sh "${GITHUB_REF_NAME}" "data: census slice $(date -u +%Y-%m-%dT%H:%MZ)"
