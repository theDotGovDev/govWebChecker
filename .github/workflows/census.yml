name: census

# The broad tier: every registered US `.gov` domain, covered over about a week.
#
# One seventh of the frame per day. The slice is a pure function of the date, so
# seven consecutive runs cover the frame exactly once — no domain twice, none
# missed — and a domain's slice never moves when the registry gains or loses
# entries (spec.md FR-111 to FR-113).
#
# This is NOT an outage-detection instrument, and the record says so. A weekly
# reading cannot see a thirty-minute interruption; that is what the hourly hot
# tier in `check.yml` is for. This answers questions about coverage and change
# over months.
#
# Cost per run: at most one reading plus one robots.txt per domain that publishes
# a web address — roughly 2,045 of the ~2,364 in a slice. The rest publish no web
# address and receive no request at all, because DNS already told us there is
# nothing there and asking anyway would spend a jurisdiction's resources to learn
# it twice.

# SCHEDULE DISABLED — a slice does not fit inside the job cap.
#
# The first live sweep (run 32554093317, slice 0) was cancelled at exactly 120
# minutes with nothing published. Two hours of real requests to roughly two
# thousand government domains, and every measurement discarded.
#
# Leaving the cron enabled would repeat that daily. Spending a jurisdiction's
# resources on a request whose result we then throw away is not a measurement, it
# is just traffic — and Principle I does not permit it. So the schedule is off
# until a slice provably fits, and only `workflow_dispatch` remains for testing.
#
# The cause is measured, not guessed: the robots.txt fetch and the page check are
# two requests to the same host, so the second pays the full 15s per-host
# interval. Simulating the real limiter at 1/100 scale puts that at ~91 minutes of
# pure waiting for ~2,045 web-publishing domains, before a single HTTP response is
# accounted for. Timeouts then push it past the cap.
#
# The proposed fix is at research.md R8: treat robots.txt as a continuation of one
# visit rather than a second independent reading — the backend budget still
# charges, the name-keyed interval does not. Simulated at ~34 minutes. That is a
# change to a politeness limit and awaits the project owner's decision.
#
# When the schedule returns, restore: - cron: '7 9 * * *'  (09:07 UTC, deliberately
# away from check.yml's hourly slot, per research.md R5).

on:
  workflow_dispatch:
    inputs:
      slice:
        description: 'Slice to run (0-6). Blank uses the slice for today.'
        required: false
        default: ''

# Two census runs must never race the commit. Deliberately a DIFFERENT group from
# `check.yml`: sharing one would make a two-hour census block the hourly check,
# and GitHub cancels rather than queues a second pending run in a group — so the
# hot tier would lose readings, which is the data loss this project exists to
# avoid. The two tiers therefore overlap in principle, which is the carried risk
# in research.md R5, bounded by the concurrency cap and visible afterwards through
# `verify`. Both commit to the same file, and the rebase-retry below is what makes
# that safe.
concurrency:
  group: census-record
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  census:
    runs-on: ubuntu-latest
    # Measured, not assumed: the first live sweep hit this cap exactly and was
    # cancelled with nothing published. The cap is not the problem — the per-host
    # interval being charged twice per domain is — so raising it would only make
    # the same wasted traffic take longer to discard.
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - run: npm ci
      - run: npm run build

      - name: Run one slice of the census
        # The slice is read from the environment rather than interpolated into the
        # command. On a scheduled run `inputs` does not exist, and an expression
        # that assumes it does would pass a bare `--slice` with no value.
        env:
          SLICE: ${{ github.event.inputs.slice }}
        run: |
          set -e
          if [ -n "$SLICE" ]; then
            node dist/src/cli/index.js census --slice "$SLICE"
          else
            node dist/src/cli/index.js census
          fi

      - name: Keep the readings before anything can reject them
        # A slice costs about a hundred minutes of real requests to roughly two
        # thousand government servers. Twice now that traffic has been spent and
        # discarded — once to the job cap, once to a `verify` check that was wrong
        # about what it was measuring. Both times the readings existed on disk and
        # died with the runner.
        #
        # Uploading first means a rejection costs the commit, not the measurements.
        # Whatever the gate below decides, the data can be inspected, and published
        # after review rather than re-collected at the targets' expense.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: census-record-${{ github.run_id }}
          path: data/
          retention-days: 14
          if-no-files-found: warn

      - name: Verify our own conduct before publishing it
        # Identical in spirit to `check.yml`: a run that violated a politeness
        # guarantee discards its readings rather than publishing them. Publishing
        # data that fails our own stated checks would be worse than publishing
        # nothing.
        #
        # Only observation files are verified. `data/runs/` holds run summaries,
        # which have no host and are not what `verify` checks.
        run: |
          set -e
          shopt -s nullglob
          files=(data/availability/*.jsonl)
          if [ ${#files[@]} -eq 0 ]; then
            echo "no observation files produced — nothing to verify or publish"
            exit 0
          fi
          for file in "${files[@]}"; do
            echo "verifying $file"
            node dist/src/cli/index.js verify "$file"
          done

      - name: Commit the record
        run: |
          set -e
          if [ -z "$(git status --porcelain data/)" ]; then
            echo "no new observations — nothing to commit"
            exit 0
          fi
          git config user.name 'govwebchecker[bot]'
          git config user.email 'govwebchecker[bot]@users.noreply.github.com'
          git add data/
          git commit -m "data: census slice $(date -u +%Y-%m-%dT%H:%MZ)"
          # Rebase rather than force. The record is append-only, and losing the
          # hourly check's observations to a push race would be a silent hole.
          for attempt in 1 2 3; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push && exit 0
            sleep $((attempt * 5))
          done
          echo "could not push the record after 3 attempts" >&2
          exit 1
