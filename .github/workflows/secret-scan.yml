name: secret-scan

on:
  push:
  pull_request:

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: a secret committed and later removed is still leaked,
          # so the scan has to see every commit, not just the tip.
          fetch-depth: 0

      # The gitleaks CLI is run directly rather than through gitleaks-action.
      # The action requires a paid license for organization-owned repositories
      # and refuses to run without one — on this repo it failed without ever
      # looking at the code, which is worse than no check because it still looks
      # like a check. The scanner itself is open source and unrestricted; this
      # runs the same engine against the same .gitleaks.toml the pre-commit hook
      # uses, so the two layers stay in agreement.
      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: 8.24.3
        run: |
          set -euo pipefail
          curl -sSfL \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            -o gitleaks.tar.gz
          tar -xzf gitleaks.tar.gz gitleaks
          sudo install -m 0755 gitleaks /usr/local/bin/gitleaks
          rm -f gitleaks gitleaks.tar.gz
          gitleaks version

      - name: Scan history for secrets
        # --redact so a finding is reported without reprinting the secret into
        # logs that are themselves public.
        run: gitleaks detect --source . --config .gitleaks.toml --redact --verbose
