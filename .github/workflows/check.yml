name: check

# The collector itself, called by the six `check-*` schedules rather than
# carrying one of its own.
#
# Why six callers instead of one hourly cron: GitHub does not so much drop
# scheduled events as *delay* them — a `41 5 * * *` deep-check run was observed
# starting at 16:46, eleven hours late — and it holds only one pending run per
# workflow. So a delay longer than the period collapses the backlog: eleven
# pending hourly runs become one, and an hourly cron degrades to roughly one run
# per delay-period. That is how twenty-four scheduled checks a day became three
# on 2026-08-27.
#
# Delay is per workflow, not per repository: deep-check delivered its run during
# the exact window in which this workflow received nothing. Six workflows are
# therefore six independent schedule queues, each of which still delivers under a
# long delay. Each fires every six hours, staggered, so the union is one run an
# hour when GitHub is healthy — no over-collection to absorb — and about half
# that when a backlog is draining.
#
# The cadence floor is not here. It is in the code (src/checker/due.ts), because
# a cron cannot hold one: runs arrive early, late and bunched, and only something
# reading the record can decide whether traffic should actually be sent.

on:
  workflow_call:
  workflow_dispatch:
  # A seventh queue, and the safety net.
  #
  # This workflow's schedule was removed when the six callers were added, which
  # replaced the one queue GitHub was demonstrably still delivering with six
  # unproven ones. It delivered three runs a day; the six delivered none in the
  # twelve hours after they landed, so collection went from poor to nothing. A
  # new workflow's schedule can take time to register, and the six may yet come
  # good — but "may yet" is not a collection strategy.
  #
  # Its hours deliberately duplicate a caller's. Duplication is free: the cadence
  # floor in src/checker/due.ts means a second run inside the hour sends no
  # traffic and writes nothing, which is exactly what makes redundant queues a
  # safe way to buy reliability.
  schedule:
    - cron: '19 1,7,13,19 * * *'

# One group across every workflow that sends traffic to a target — the six
# `check-*` schedules, `census` and `deep-check`. The politeness limits live in a
# RateLimiter *instance*, so they hold within one process and are blind to a
# second collector on another runner. Serializing the collectors is what makes
# the per-address guarantee true of the published record rather than merely true
# of each run (FR-140e).
#
# Declared here rather than on the six callers, deliberately. It has to cover a
# direct `workflow_dispatch` of this workflow too, and declaring it in both
# places would deadlock: the caller would hold the group while the job it called
# waited for the same group.
#
# Queue rather than cancel: a cancelled run is a gap in the record, and gaps are
# meant to mean "we did not measure". GitHub keeps only one run pending per
# group, so a check colliding with a long census runs late and a second one
# behind it is superseded — which costs little now, because a superseded run
# would almost always have found itself inside the cadence floor and sent
# nothing anyway.
concurrency:
  group: target-traffic
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - run: npm ci
      - run: npm run build

      - name: Run the checks
        run: node dist/src/cli/index.js check

      - name: Verify our own conduct before publishing it
        # If the run violated a politeness guarantee, the record does not get
        # committed. Publishing data that fails our own stated checks would be
        # worse than publishing nothing.
        #
        # Only observation files are verified. data/runs/ holds run summaries,
        # which have no host and are not what `verify` checks — globbing
        # data/*/*.jsonl swept them in and crashed the step, which skipped the
        # commit and discarded a whole run's good measurements.
        run: |
          set -e
          shopt -s nullglob
          files=(data/availability/*.jsonl)
          if [ ${#files[@]} -eq 0 ]; then
            echo "no observation files produced — nothing to verify or publish"
            exit 0
          fi
          for file in "${files[@]}"; do
            echo "verifying $file"
            node dist/src/cli/index.js verify "$file"
          done

      - name: Publish the record
        # Append-only rows, published past a concurrent writer. Rebasing two
        # appends to one file produces a conflict git cannot resolve and this
        # script can: the correct merge of two appends is both appends. Tested in
        # tests/integration/publish-record.test.ts.
        run: |
          scripts/publish-record.sh "${GITHUB_REF_NAME}" "data: availability observations $(date -u +%Y-%m-%dT%H:%MZ)"
