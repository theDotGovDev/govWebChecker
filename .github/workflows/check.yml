name: check

on:
  schedule:
    # Hourly. Still statistical rather than operational: ~720 readings per site
    # per month give a 30-minute interruption a fair chance of being caught and a
    # 2-hour one a good chance of being caught repeatedly, so short outages reach
    # the reliability record instead of falling between checks. This is not
    # real-time detection — an outage between checks is invisible, and one we
    # catch is dated to when we looked (spec.md FR-009).
    #
    # Cost at this cadence: 1 reading + 1 robots.txt per host per hour, and about
    # 20 MB of packed git history per year.
    - cron: '23 * * * *'
  workflow_dispatch:

# Two runs must never race the commit. Queue rather than cancel: a cancelled run
# is a gap in the record, and gaps are meant to mean "we did not measure".
concurrency:
  group: availability-check
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - run: npm ci
      - run: npm run build

      - name: Run the checks
        run: node dist/src/cli/index.js check

      - name: Verify our own conduct before publishing it
        # If the run violated a politeness guarantee, the record does not get
        # committed. Publishing data that fails our own stated checks would be
        # worse than publishing nothing.
        #
        # Only observation files are verified. data/runs/ holds run summaries,
        # which have no host and are not what `verify` checks — globbing
        # data/*/*.jsonl swept them in and crashed the step, which skipped the
        # commit and discarded a whole run's good measurements.
        run: |
          set -e
          shopt -s nullglob
          files=(data/availability/*.jsonl)
          if [ ${#files[@]} -eq 0 ]; then
            echo "no observation files produced — nothing to verify or publish"
            exit 0
          fi
          for file in "${files[@]}"; do
            echo "verifying $file"
            node dist/src/cli/index.js verify "$file"
          done

      - name: Commit the record
        run: |
          set -e
          if [ -z "$(git status --porcelain data/)" ]; then
            echo "no new observations — nothing to commit"
            exit 0
          fi
          git config user.name 'govwebchecker[bot]'
          git config user.email 'govwebchecker[bot]@users.noreply.github.com'
          git add data/
          git commit -m "data: availability observations $(date -u +%Y-%m-%dT%H:%MZ)"
          # Another run may have landed while this one was checking. Rebase rather
          # than force: the record is append-only, and losing someone else's
          # observations to a push race would be a silent hole in the history.
          for attempt in 1 2 3; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push && exit 0
            sleep $((attempt * 5))
          done
          echo "could not push the record after 3 attempts" >&2
          exit 1
