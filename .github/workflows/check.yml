name: check

on:
  schedule:
    # Hourly. Still statistical rather than operational: ~720 readings per site
    # per month give a 30-minute interruption a fair chance of being caught and a
    # 2-hour one a good chance of being caught repeatedly, so short outages reach
    # the reliability record instead of falling between checks. This is not
    # real-time detection — an outage between checks is invisible, and one we
    # catch is dated to when we looked (spec.md FR-009).
    #
    # Cost at this cadence: 1 reading + 1 robots.txt per host per hour, and about
    # 20 MB of packed git history per year.
    - cron: '23 * * * *'
  workflow_dispatch:

# One group across every workflow that sends traffic to a target — `check`,
# `census` and `deep-check`. The politeness limits live in a RateLimiter
# *instance*, so they hold within one process and are blind to a second collector
# on another runner. Serializing the collectors is what makes the per-address
# guarantee true of the published record rather than merely true of each run.
#
# This reverses a deliberate choice (research.md R5): the groups were split so a
# long census could not block the hourly check, accepting cross-tier overlap as a
# bounded risk "visible afterwards through verify". It materialised on
# 2026-08-26 — a census slice and an hourly check hit one WordPress VIP edge
# 126ms apart — and the cost was the opposite of what the split protected. The
# record is append-only, so that pair failed verify on every subsequent run and
# twenty hours of hourly readings were collected and discarded, against the one
# or two slots per day that queueing costs.
#
# Queue rather than cancel: a cancelled run is a gap in the record, and gaps are
# meant to mean "we did not measure". GitHub still keeps only one run pending per
# group, so an hourly check that collides with a long collector runs late, and a
# second one behind it is dropped. That is a visible gap rather than a false
# claim, which is the direction Principle V requires erring in.
concurrency:
  group: target-traffic
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - run: npm ci
      - run: npm run build

      - name: Run the checks
        run: node dist/src/cli/index.js check

      - name: Verify our own conduct before publishing it
        # If the run violated a politeness guarantee, the record does not get
        # committed. Publishing data that fails our own stated checks would be
        # worse than publishing nothing.
        #
        # Only observation files are verified. data/runs/ holds run summaries,
        # which have no host and are not what `verify` checks — globbing
        # data/*/*.jsonl swept them in and crashed the step, which skipped the
        # commit and discarded a whole run's good measurements.
        run: |
          set -e
          shopt -s nullglob
          files=(data/availability/*.jsonl)
          if [ ${#files[@]} -eq 0 ]; then
            echo "no observation files produced — nothing to verify or publish"
            exit 0
          fi
          for file in "${files[@]}"; do
            echo "verifying $file"
            node dist/src/cli/index.js verify "$file"
          done

      - name: Publish the record
        # Append-only rows, published past a concurrent writer. Rebasing two
        # appends to one file produces a conflict git cannot resolve and this
        # script can: the correct merge of two appends is both appends. Tested in
        # tests/integration/publish-record.test.ts.
        run: |
          scripts/publish-record.sh "${GITHUB_REF_NAME}" "data: availability observations $(date -u +%Y-%m-%dT%H:%MZ)"
